services:
  - type: web
    name: almamo-accounting
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.23.2"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANDROID_PACKAGE_NAME
        value: com.almamo.hardware
      - key: ANDROID_SHA256_FINGERPRINTS
        sync: false

