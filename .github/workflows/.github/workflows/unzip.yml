
name: Automatic ZIP Extractor

on:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP files
        run: |
          mkdir -p extracted
          for file in *.zip; do
            [ -f "$file" ] || continue
            echo "Extracting $file"
            unzip -o "$file" -d extracted
          done

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted
          git diff --cached --quiet || git commit -m "Automatically extract ZIP"
          git push
