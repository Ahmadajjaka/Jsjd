
name: Extract ZIP

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP safely
        shell: bash
        run: |
          python - <<'PY'
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          output = Path("extracted").resolve()
          output.mkdir(parents=True, exist_ok=True)

          archives = list(Path(".").glob("*.zip"))
          if not archives:
              raise SystemExit("No ZIP files found")

          for archive in archives:
              print("Extracting:", archive.name)
              with zipfile.ZipFile(archive) as zf:
                  entries = zf.infolist()

                  if len(entries) > 20000:
                      raise SystemExit("Too many files in ZIP")

                  if sum(x.file_size for x in entries) > 2 * 1024**3:
                      raise SystemExit("ZIP exceeds 2 GB uncompressed")

                  for info in entries:
                      name = info.filename.replace("\\", "/")
                      path = PurePosixPath(name)

                      if path.is_absolute() or ".." in path.parts:
                          raise SystemExit("Unsafe ZIP path: " + name)

                      mode = info.external_attr >> 16
                      kind = stat.S_IFMT(mode)
                      if kind not in (0, stat.S_IFREG, stat.S_IFDIR):
                          raise SystemExit("Unsupported file type: " + name)

                      target = (output / Path(*path.parts)).resolve()
                      if target != output and output not in target.parents:
                          raise SystemExit("Unsafe destination: " + name)

                  for info in entries:
                      path = PurePosixPath(
                          info.filename.replace("\\", "/")
                      )
                      target = output / Path(*path.parts)

                      if info.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with zf.open(info) as src, target.open("wb") as dst:
                              while True:
                                  chunk = src.read(1024 * 1024)
                                  if not chunk:
                                      break
                                  dst.write(chunk)

          print("Extraction completed")
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- extracted
          git diff --cached --quiet || git commit -m "Extract ZIP files"
          git push
